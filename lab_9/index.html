<!DOCTYPE html>

<html lang="mn">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hangman</title>

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <header>
            <h1>HANGMAN</h1>
            <p>Guess the country!</p>
        </header>

        <main class="container">

            <section class="game-board">
                <svg class="hangman" viewBox="0 0 200 250">
  
                    <line x1="20" y1="230" x2="180" y2="230" />
                    <line x1="50" y1="230" x2="50" y2="20" />
                    <line x1="50" y1="20" x2="140" y2="20" />
                    <line x1="140" y1="20" x2="140" y2="50" />

                    <circle class="figure-part" cx="140" cy="70" r="20" />
                    <line class="figure-part" x1="140" y1="90" x2="140" y2="150" />
                    <line class="figure-part" x1="140" y1="110" x2="115" y2="130" />
                    <line class="figure-part" x1="140" y1="110" x2="165" y2="130" />
                    <line class="figure-part" x1="140" y1="150" x2="115" y2="180" />
                    <line class="figure-part" x1="140" y1="150" x2="165" y2="180" />
                </svg>
            </section>

            <section class="country-area">
                <h2>Энэ ямар улсын далбаа вэ?</h2>
                <div id="flag"></div>
                <div id="word"></div>
            </section>

            <section class="game-info">
                <p>Үлдсэн амь: <span id="lives">5</span></p>
                <hr>
                <p>Сонгосон үсгүүд:</p>
                <div id="guessed-letters"></div>
            </section>

            <section class="keyboard" id="keyboard">
            </section>
        </main>

        <div class="game-message" id="game-message">
            <div class="message-box">
                <h2 id="message"></h2>
                <p id="correct-answer"></p>
                <button id="restart">Дахин эхлүүлэх</button>
            </div>
        </div>

        <footer>
            <p>Hangman</p>
        </footer>

    </body>
</html>
